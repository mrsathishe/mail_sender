# nginx site for the Mail Sender app (Next.js).
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mail-sender
#   sudo ln -s /etc/nginx/sites-available/mail-sender /etc/nginx/sites-enabled/mail-sender
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS:
#   sudo certbot --nginx -d mail.satz.co.in
#
# Unlike the static "status" site, Mail Sender is a Next.js server (SSR pages +
# API routes in one Node process). nginx does NOT serve files here — it reverse-
# proxies every request to the Next.js server that systemd runs on localhost.

server {
    listen 80;
    server_name mail.satz.co.in;

    # Outer bound for everything except the send endpoint below, which raises it for
    # itself. Keeping this low means nginx sheds an extreme POST — a multi-megabyte body
    # aimed at a page or an admin route — without waking the Node process at all.
    client_max_body_size 1m;

    # In the server block so both locations inherit them. They must NOT be repeated
    # inside a location: setting any proxy_set_header there replaces the whole
    # inherited set, which would silently drop the forwarded headers below.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Next.js builds absolute redirect URLs (e.g. /login) from these — without
    # them it falls back to its own bind address and redirects to localhost:3100.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # WebSocket / HMR upgrade headers (harmless in prod, needed if you ever proxy dev).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
    }

    # The one endpoint that accepts file uploads (ATTACHMENT_MAX_TOTAL_BYTES in
    # src/lib/attachments.ts caps the request at 5MB). 6m rather than 5m because
    # multipart framing — boundaries and per-part headers — puts a 5MB file slightly
    # over 5MB on the wire, and nginx would otherwise reject it with an HTML 413 that
    # carries neither the CORS headers nor the JSON error a browser form reads.
    #
    # /api/contact is deliberately *not* listed: our own help form takes text only, so it
    # stays on the 1m server-wide cap. An unauthenticated route is the last one that
    # should be allowed to hand Node a multi-megabyte body.
    #
    # This has to cover *all* send traffic, not just uploads: client_max_body_size is
    # per-location and there is one send endpoint, so an app that never enabled uploads
    # passes through the same 6m gate. It is then held to 500KB by MAX_BODY_BYTES in the
    # app, which is where the real per-app limit lives. Request buffering stays on (the
    # default) deliberately — streaming to Node would let its byte counter refuse a
    # client mid-upload, but it moves slow-client exposure onto the Node process and can
    # reset the connection before our JSON 413 is readable, which is the error message
    # the browser integration depends on.
    location = /api/v1/send {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
    }
}
